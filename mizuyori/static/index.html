<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizuyori</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1 id="имя">Mizuyori</h1>
    <p class="подпись" id="подпись">Загрузка…</p>
  </header>

  <section class="карточка">
    <h2>Записи</h2>
    <form id="форма">
      <input id="поле" type="text" maxlength="5000" placeholder="Новая запись…" autocomplete="off" required>
      <button type="submit">Добавить</button>
    </form>
    <p class="ошибка" id="ошибка" hidden></p>
    <ul id="список"></ul>
    <p class="пусто" id="пусто" hidden>Пока нет ни одной записи.</p>
  </section>

  <section class="карточка">
    <h2>Состояние</h2>
    <dl id="состояние"></dl>
  </section>
</main>
<script src="/static/app.js" charset="utf-8"></script>
</body>
</html>
